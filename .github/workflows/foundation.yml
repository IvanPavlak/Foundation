# Foundation: shellcheck, shfmt and the bats suites on macOS, the only Unix it runs on. The file is
# named after the project so it never collides with another upstream's workflows in a fork that
# merges several (winux.yml is WinuX's).
# Only the pure helpers and file checks run here; AeroSpace and WezTerm are exercised by hand.
name: Foundation

# Every pull request runs it, and every push to master: the repository is all Unix, so the
# required `Unix Tests` check always reports. A push to any other branch does not, since its pull
# request runs the same commit (a macOS run per push and per pull request doubled every branch).
on:
  push:
    branches: [master]
  pull_request:
  # Manual escape hatch: re-fires the run when GitHub drops the push or
  # pull_request event. GitHub restricts workflow_dispatch to collaborators with write access.
  workflow_dispatch:

# Cancel superseded runs on the same ref (macOS runners are the costly ones).
concurrency:
  group: unix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unix Tests
    # Never in a private repository: macOS runners bill at ten times the Linux rate, so a private
    # fork runs the suites locally through Run-Tests. Foundation is public, where the job always runs.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history (blobless) so Run-Tests --audit-since can find the merge base.
          fetch-depth: 0
          filter: blob:none
      - name: Install tools
        run: brew install bash bats-core shellcheck shfmt chezmoi
      # The file list comes from Run-Tests --lint-files, the one Run-Tests --lint checks; the
      # other shellcheck settings are in Unix/.shellcheckrc (only the severity is a flag).
      - name: shellcheck
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <("$(brew --prefix)/bin/bash" Unix/modules/Tests/bin/Run-Tests --lint-files)
          [ ${#files[@]} -gt 0 ] || { echo "::error::Run-Tests --lint-files printed no file"; exit 1; }
          shellcheck -S warning "${files[@]}"
      # The style (tabs, case branches indented) is in Unix/.editorconfig, which shfmt reads only
      # when no formatting flag is given.
      - name: shfmt
        run: shfmt -d $(shfmt -f Unix)
      # The full suite through Run-Tests (its queue and run log), plus the selector audit: every
      # failing suite Run-Tests --changed would have left out for this push or pull request
      # becomes a warning annotation. The audit never fails the job.
      - name: bats
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          audit=()
          case $BASE in '' | 0000000000000000000000000000000000000000) ;; *) audit=(--audit-since "$BASE") ;; esac
          "$(brew --prefix)/bin/bash" Unix/modules/Tests/bin/Run-Tests --no-lint --detailed "${audit[@]}"
      # The run log (Unix/tests/Results, gitignored): conditions, slowest tests and every suite's
      # TAP output. Missing only when an earlier step failed, so that warns instead of failing.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unix-run-log
          path: Unix/tests/Results/TestRun_*.log
          if-no-files-found: warn

  # The mirror contract: every mirror line of Unix/config/upstream.conf names a file the sibling upstream ships with
  # the same bytes. A drift is reported here, at the pull request, as a warning per file (both
  # sides of a coordinated change cannot both be merged first, so it never fails the run). Runs
  # only in the repository the manifest's url names; a fork's mirror files are its own.
  mirror:
    name: Mirror contract
    if: ${{ !github.event.repository.private }}   # never in a private repository (see the test job)
    runs-on: ubuntu-latest
    env:
      SIBLING: IvanPavlak/WinuX
    steps:
      - uses: actions/checkout@v5
      - name: Compare the mirror files with WinuX
        shell: bash
        run: |
          manifest=Unix/config/upstream.conf
          home=$(awk '$1 == "url" { print $2; exit }' "$manifest" | sed -E 's#^https?://[^/]*github\.com/##; s#\.git$##' | tr '[:upper:]' '[:lower:]')
          if [ "$home" != "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "Not $home - the mirror contract is checked only in the upstream itself."
            exit 0
          fi
          drift=0
          for path in $(awk '$1 == "mirror" { print $2 }' "$manifest"); do
            if ! curl -fsSL "https://raw.githubusercontent.com/$SIBLING/master/$path" -o "$RUNNER_TEMP/sibling"; then
              echo "::warning file=$path::$SIBLING does not ship the mirror file $path"
              drift=1
            elif ! cmp -s "$RUNNER_TEMP/sibling" "$path"; then
              echo "::warning file=$path::$path differs from $SIBLING's copy - the mirror contract says both upstreams ship the same bytes"
              drift=1
            fi
          done
          [ "$drift" -eq 0 ] && echo "Every mirror file matches $SIBLING."
          exit 0
