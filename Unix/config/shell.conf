# Shell line editing - the PSReadLine settings of Configuration(.local).psd1. Read by the
# LineEditing stage of Unix/shell/shellrc.sh, through foundation-shell-settings; zsh only, except
# history-size, history-file and edit-mode emacs|vi, which bash applies too.
#
# Ships empty: Foundation enforces no line-editing behaviour, and a kind without a line keeps the
# shell's own default. A fork sets what it wants in shell.local.conf (same format).
#
#   history-size N            commands kept in memory and in the history file (MaximumHistoryCount;
#                             4096 without a line, PSReadLine's default)
#   history-file PATH         where the history is saved (HistorySavePath); ~ and $VARIABLES expand;
#                             without a line ~/.zsh_history in zsh, ~/.bash_history in bash
#   edit-mode emacs|vi|windows  the line-editing keys (EditMode; emacs without a line). windows is
#                             emacs plus, under the key lines, the Windows-mode keys ported: Tab and
#                             Shift+Tab cycling in place (no list, no bell), Home, End, Delete,
#                             Ctrl+Left/Right
#   key KEY FUNCTION          a key handler (KeyHandlers): KEY a PSReadLine key name (UpArrow,
#                             Shift+Tab, Ctrl+Spacebar, Ctrl+r, Alt+b, F2, ...) or a bindkey
#                             sequence starting with ^; FUNCTION a PSReadLine function name
#                             (HistorySearchBackward, MenuComplete, TabCompleteNext, ...) or a zle
#                             widget name. A later line wins per key; FUNCTION - drops the key,
#                             a windows-mode binding included, so it keeps the shell's default
#   history-no-duplicates on|off  repeated commands are skipped when recalling; the file keeps
#                             every line (HistoryNoDuplicates)
#   history-save-style incrementally|at-exit|nothing  when lines reach the file (HistorySaveStyle;
#                             zsh writes at exit without a line); all but nothing skip a line equal
#                             to the one before it, as PSReadLine does
#   completion-ignore-case on|off  Tab matches in any case, as PowerShell always does
#   prediction-source none|history  where predictions come from (PredictionSource)
#   prediction-view inline|list     how they show (PredictionViewStyle): history with list is the
#                             list below the line (Unix/shell/prediction-list.zsh); inline is not
#                             ported
#   prediction-list-marker TEXT     what starts each row of the list (> without a line)
#   color-list-prediction COLOR     the list's rows (yellow); color-list-prediction-selected COLOR
#                             the selected row's background (238); color-emphasis COLOR the typed
#                             text in the rows (14). COLOR: black red green yellow blue magenta
#                             cyan white default, 0-255, or #RRGGBB
#
# Example (WinuX's base Configuration.psd1):
#
#   edit-mode              windows
#   key UpArrow            HistorySearchBackward
#   key DownArrow          HistorySearchForward
#   history-no-duplicates  on
#
# A line may start with @TYPE to apply on one machine type only; shell.local.conf lines win.
