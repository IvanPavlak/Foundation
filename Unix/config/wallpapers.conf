# Desktop wallpapers per theme and machine type - WallpaperDarkSettings / WallpaperLightSettings
# of Configuration(.local).psd1. Read by Set-Wallpaper.
#
#   directory PATH          where relative files live (default: the repository's Wallpapers/)
#   [Dark] / [Light]        one section per theme
#   MACHINE FILE [FILE...]  wallpaper for machine type MACHINE (config/machines.conf); several
#                           files are per display, in display order, and cycle when there are
#                           more displays than files (the Monitors array). `Default` applies to
#                           machine types without a line of their own. A path with spaces
#                           goes in double quotes.
#
# macOS always fills the screen with the picture; the Windows styles (Fill, Fit, Stretch, ...)
# have no counterpart that AppleScript can set.

directory $DOTFILES_ROOT/Wallpapers

[Dark]
Test     Black.jpg
Default  Black.jpg

[Light]
Test     White.png
Default  White.png
