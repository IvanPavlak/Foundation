# Terminal greeting - TerminalGreeting and Universal.FastFetchImageLogo of Configuration(.local).psd1.
# Read by Show-TerminalGreeting (alias c, and every new shell), Invoke-Clear, Invoke-Fastfetch and
# Invoke-Onefetch.
#
#   clear on|off                clear the screen before the greeting (Clear.Enabled)
#   fastfetch on|off            the fastfetch system info panel (Fastfetch.Enabled)
#   fastfetch-auto-fit on|off   measure the panel and fit it to the window: in WezTerm the font is
#                               reset, then shrunk one step at a time; a panel that still does not
#                               fit, and one in any other terminal, loses its logo
#                               (Fastfetch.AutoFit.Enabled)
#   fastfetch-max-shrink-steps N
#                               font steps allowed below the default, 0-50 (MaxShrinkSteps)
#   fastfetch-reflow-timeout-ms N
#                               how long to wait for the window to reflow after a font step, in
#                               milliseconds, 1-10000 (ReflowTimeoutMilliseconds)
#   fastfetch-prompt-reserve N  rows kept free below the panels for the next prompt, 0-20
#                               (Fastfetch.AutoFit.PromptReserve)
#   image-logo PATH [WxH]       the image fastfetch draws instead of the text logo of
#                               FastFetch/Unix/config_<Type>.jsonc, in the terminals that show images
#                               (WezTerm, Ghostty, kitty); WxH is its size in cells (default 30x14).
#                               ~ and $VARIABLES expand, a relative PATH is under the repository. A
#                               machine type without a line keeps the text logo; prefix lines with
#                               @TYPE for one image per machine type.
#   onefetch on|off             the repository panel under fastfetch, only inside a git repository;
#                               off without a line, as WinuX's base Onefetch.Enabled
#   onefetch-auto-fit on|off    count its height when fastfetch fits the panel to the window
#                               (IncludeInAutoFit)
#   onefetch-in-project-terminals on|off
#                               the panel in the first greeting of the tabs Open-ProjectTerminals
#                               opens (InProjectTerminals); --invoke-onefetch and --no-onefetch
#                               decide it for one call, and `c` in the tab always draws it
#   onefetch-arguments ARGS...  passed to onefetch (none in the base)
#   onefetch-separator "TEXT"   replaces the colon after each field name (quoted: keeps spaces;
#                               the colon stays without a line)
#   onefetch-color INDEX SGR    maps an ANSI index onefetch was given (0-15) onto an SGR code,
#                               e.g. true color 38;2;R;G;B (onefetch itself only takes 0-15); the
#                               last line for an index wins

clear                        on
fastfetch                    on
fastfetch-auto-fit           on
fastfetch-max-shrink-steps   10
fastfetch-reflow-timeout-ms  10
fastfetch-prompt-reserve     1

onefetch                       off
onefetch-auto-fit              on
onefetch-in-project-terminals  on
