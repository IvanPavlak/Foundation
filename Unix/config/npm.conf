# npm settings of Configure-NpmConfig (the Unix counterpart of the Windows PathTemplates.NpmConfig
# and NpmRegistries).
#
#   npmrc PATH            the user npmrc the token goes into; default ~/.npmrc (a relative path
#                         starts at the repository root)
#   registry URL [SCOPE]  a private registry to authenticate: the token is written as
#                         //HOST/PATH/:_authToken=TOKEN, and with a SCOPE (@my-org) also
#                         SCOPE:registry=URL, so `npm install` of an @my-org package goes there.
#                         One line per registry; the last line of a URL wins, so an overlay line
#                         adds a SCOPE to the base registry
#
# The token is a GitHub personal access token with read:packages (the one Configure-NuGetConfig
# asks for works), typed at the command's own prompt and never stored here.
# ~ and $VAR expand in paths. A line may start with @TYPE to apply on one machine type only.
npmrc ~/.npmrc
registry https://npm.pkg.github.com/
