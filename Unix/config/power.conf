# Sleep and power settings - the PowerPlans and PowerButtonActions of Configuration(.local).psd1.
# Read by Set-PowerSettings (bootstrap step Power, which asks for the administrator password).
#
#   [AC]        on the charger (pmset -c)
#   [Battery]   on battery (pmset -b); skipped on a Mac without a battery
#   [All]       every power source (pmset -a)
#   KEY VALUE   a pmset setting, minutes for the sleep timers, 0 = never; 1/0 for switches
#   @TYPE ...   any line: only on that machine type (machines.conf)
#
# A key this Mac does not support (`pmset -g cap`) is skipped with a warning; `lidwake`, for one,
# is not offered on Apple silicon MacBooks. power.local.conf replaces whole sections.

[All]
# The same timers on the charger and on battery.
displaysleep 5
sleep 10

[AC]
# Wake for network access, so Send-WakeOnLan can wake this Mac.
womp 1

[Battery]
# No Power Nap checks while asleep on battery.
powernap 0
# Slightly dim the display on battery.
lessbright 1
