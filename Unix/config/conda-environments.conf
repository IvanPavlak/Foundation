# Conda environments Install-CondaEnvironments creates (the Unix counterpart of the Windows
# BootstrapConfig.DataFiles.CondaEnvironments folder).
#
#   directory PATH      folder of the environment files (~ and $VAR expand; a relative path is
#                       relative to the repository root); default Conda/Environments/macOS
#   env NAME            create NAME from NAME.yml in that folder; without any env line, every
#                       .yml file in the folder is created
#   update-base on|off  first run `conda update -n base -c defaults conda` (default off: the
#                       defaults channel needs its Terms of Service accepted, `conda tos accept`)
#
# The environment is named after its file; one that already exists is left alone. The Windows
# exports in Conda/Environments carry win-64 builds and Windows-only packages, so the macOS
# copies live in Conda/Environments/macOS and use conda-forge. conda 26 still checks the
# Terms of Service of the defaults channels it is configured with, so a fresh Mac needs
# `conda tos accept` once (a refused run prints the full command). A line may start with @TYPE
# to apply on one machine type only.
directory Conda/Environments/macOS
update-base off
