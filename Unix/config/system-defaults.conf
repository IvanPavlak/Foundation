# macOS system settings - the ExplorerOptions, TaskbarSettings and VisualEffects of
# Configuration(.local).psd1. Read by Set-SystemDefaults (bootstrap step SystemDefaults).
#
#   [Group]                                  one group per section, applied in file order;
#                                            Set-SystemDefaults GROUP / --skip GROUP select them
#   defaults DOMAIN KEY TYPE VALUE...        defaults write (TYPE -bool -boolean -int -integer
#                                            -float -string -date -data -array -array-add -dict
#                                            -dict-add; -string may hold spaces; -array and -dict
#                                            values are split into words; a KEY with spaces
#                                            goes in "double quotes")
#   currenthost DOMAIN KEY TYPE VALUE...     defaults -currentHost write
#   delete DOMAIN KEY                        defaults delete
#   mkdir PATH                               create a folder a setting points at
#   command NAME ARGS...                     run another Foundation command
#   restart PROCESS...                       restarted once at the end so the change shows
#   note TEXT                                printed at the end
#   @TYPE ...                                any line: only on that machine type (machines.conf)
#
# system-defaults.local.conf replaces whole sections; an empty [Group] there turns it off.
# No trailing comments on a data line. Research and the full inventory of keys:
# Backlog/MacOS/Research/MacOSDefaultsInventory.md.

[Dock]
defaults com.apple.dock orientation -string bottom
defaults com.apple.dock tilesize -int 50
defaults com.apple.dock magnification -bool false
defaults com.apple.dock mineffect -string scale
defaults com.apple.dock minimize-to-application -bool true
defaults com.apple.dock launchanim -bool false
defaults com.apple.dock show-recents -bool false
# Scrolling up on a Dock icon shows that app's windows.
defaults com.apple.dock scroll-to-open -bool true
defaults com.apple.dock autohide -bool true
# Show the hidden Dock at once, with a quick slide.
defaults com.apple.dock autohide-delay -float 0
defaults com.apple.dock autohide-time-modifier -float 0.15
# AeroSpace: keep Spaces in a fixed order.
defaults com.apple.dock mru-spaces -bool false
restart Dock

[Finder]
defaults NSGlobalDomain AppleShowAllExtensions -bool true
defaults com.apple.finder AppleShowAllFiles -bool true
defaults com.apple.finder ShowPathbar -bool true
defaults com.apple.finder ShowStatusBar -bool true
defaults com.apple.finder _FXShowPosixPathInTitle -bool true
defaults com.apple.finder FXPreferredViewStyle -string Nlsv
defaults com.apple.finder _FXSortFoldersFirst -bool true
defaults com.apple.finder _FXSortFoldersFirstOnDesktop -bool true
defaults com.apple.finder FXEnableExtensionChangeWarning -bool true
# Items in the Trash for 30 days are deleted.
defaults com.apple.finder FXRemoveOldTrashItems -bool true
# Cmd+Q quits Finder; it relaunches when needed.
defaults com.apple.finder QuitMenuItem -bool true
# No disk icons on the Desktop.
defaults com.apple.finder ShowHardDrivesOnDesktop -bool false
defaults com.apple.finder ShowExternalHardDrivesOnDesktop -bool false
defaults com.apple.finder ShowRemovableMediaOnDesktop -bool false
defaults com.apple.finder ShowMountedServersOnDesktop -bool false
# Save dialogs default to this Mac, not iCloud Drive.
defaults NSGlobalDomain NSDocumentSaveNewDocumentsToCloud -bool false
# No .DS_Store files on network shares and USB drives.
defaults com.apple.desktopservices DSDontWriteNetworkStores -bool true
defaults com.apple.desktopservices DSDontWriteUSBStores -bool true
restart Finder

[Keyboard]
# Fastest repeat System Settings offers.
defaults NSGlobalDomain KeyRepeat -int 2
defaults NSGlobalDomain InitialKeyRepeat -int 15
# Tab moves focus to every control in dialogs, as on Windows.
defaults NSGlobalDomain AppleKeyboardUIMode -int 3
# Keep typed quotes, dashes and double spaces literal.
defaults NSGlobalDomain NSAutomaticPeriodSubstitutionEnabled -bool false
defaults NSGlobalDomain NSAutomaticQuoteSubstitutionEnabled -bool false
defaults NSGlobalDomain NSAutomaticDashSubstitutionEnabled -bool false
note Keyboard changes take effect after logging out.

[Trackpad]
# Tap to click on the built-in and Bluetooth trackpads, plus the per-host and global switches.
defaults com.apple.AppleMultitouchTrackpad Clicking -bool true
defaults com.apple.driver.AppleBluetoothMultitouch.trackpad Clicking -bool true
currenthost NSGlobalDomain com.apple.mouse.tapBehavior -int 1
defaults NSGlobalDomain com.apple.mouse.tapBehavior -int 1
# Natural scrolling (trackpad and mouse), written so it survives a change in System Settings.
defaults NSGlobalDomain com.apple.swipescrolldirection -bool true
# Mouse speed: the top of the slider. Trackpad speed stays at the macOS default.
defaults NSGlobalDomain com.apple.mouse.scaling -float 3
note Trackpad and mouse changes take effect after logging out; macOS 15 and later may need the Trackpad pane opened once.

[Screenshots]
# PNG, as macOS does by default; written so a changed setting comes back. Where they are saved is
# special-folders.conf (Set-SpecialFolders).
defaults com.apple.screencapture type -string png
# Window captures without the large transparent shadow.
defaults com.apple.screencapture disable-shadow -bool true
restart SystemUIServer

[HotCorners]
# Codes: 1 nothing, 2 Mission Control, 4 Desktop, 5 start screen saver, 10 display sleep,
# 12 Notification Center, 13 Lock Screen, 14 Quick Note. Modifier 0 = no key held.
defaults com.apple.dock wvous-tl-corner -int 5
defaults com.apple.dock wvous-tl-modifier -int 0
defaults com.apple.dock wvous-tr-corner -int 13
defaults com.apple.dock wvous-tr-modifier -int 0
defaults com.apple.dock wvous-bl-corner -int 1
defaults com.apple.dock wvous-bl-modifier -int 0
defaults com.apple.dock wvous-br-corner -int 1
defaults com.apple.dock wvous-br-modifier -int 0
restart Dock

[MenuBar]
# Clock: 24-hour with seconds, weekday and date. ShowDate: 0 when space allows, 1 always, 2 never.
defaults com.apple.menuextra.clock Show24Hour -bool true
defaults com.apple.menuextra.clock ShowAMPM -bool false
defaults com.apple.menuextra.clock ShowSeconds -bool true
defaults com.apple.menuextra.clock ShowDayOfWeek -bool true
defaults com.apple.menuextra.clock ShowDayOfMonth -bool true
defaults com.apple.menuextra.clock ShowDate -int 1
# Battery percentage next to the battery icon (a per-host Control Center setting).
currenthost com.apple.controlcenter BatteryShowPercentage -bool true
restart ControlCenter

[Windows]
# AeroSpace tiles every window: macOS's own edge and Option-drag tiling stays off.
defaults com.apple.WindowManager EnableTilingByEdgeDrag -bool false
defaults com.apple.WindowManager EnableTopTilingByEdgeDrag -bool false
defaults com.apple.WindowManager EnableTilingOptionAccelerator -bool false
# A click on the wallpaper reveals the desktop only in Stage Manager.
defaults com.apple.WindowManager EnableStandardClickToShowDesktop -bool false
defaults com.apple.WindowManager StandardHideWidgets -bool true
# One Space across all displays, as the AeroSpace guide recommends.
defaults com.apple.spaces spans-displays -bool true
defaults NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false
note Window and Spaces changes take effect after logging out.

[Appearance]
# Multicolor accent: no fixed accent or highlight colour.
delete NSGlobalDomain AppleAccentColor
delete NSGlobalDomain AppleHighlightColor
defaults NSGlobalDomain AppleShowScrollBars -string Automatic
# A title-bar double-click does nothing, so it never fights AeroSpace's tiling.
defaults NSGlobalDomain AppleActionOnDoubleClick -string None
note Appearance changes show in each app after it is reopened.

[Apps]
defaults com.apple.TextEdit RichText -bool false
defaults com.apple.print.PrintingPrefs "Quit When Finished" -bool true
defaults com.apple.TimeMachine DoNotOfferNewDisksForBackup -bool true
# Activity Monitor lists all processes.
defaults com.apple.ActivityMonitor ShowCategory -int 100
# Apps start clean after a logout or relaunch, so AeroSpace and the layouts place every window.
defaults com.apple.loginwindow TALLogoutSavesState -bool false
defaults NSGlobalDomain NSQuitAlwaysKeepsWindows -bool false

[Theme]
# The theme per machine type lives in theme.conf; the wallpaper follows in the bootstrap's
# SystemTheme step.
command Set-SystemTheme --auto --skip SetWallpaper
