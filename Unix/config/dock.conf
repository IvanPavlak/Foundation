# Dock contents - the TaskbarConfiguration pins of Configuration(.local).psd1. Read by
# Set-DockPins (bootstrap step DockPins), which needs dockutil (Unix/Brewfile).
#
#   clear on|off                on: the Dock holds exactly the lines below, in order (other pins
#                               are removed; a list with a spacer is rebuilt on every run);
#                               off, or no clear line: missing pins are added, the rest stay
#   pin PATH                    an app on the left side, in file order
#   spacer                      a gap between apps
#   folder PATH [OPTION...]     a folder on the right side; options as dockutil takes them
#                               (--view fan|grid|list|auto, --display folder|stack, --sort name|dateadded|datemodified|datecreated|kind)
#   @TYPE ...                   any line: only on that machine type (machines.conf)
#
# A PATH may contain spaces and use ~; an app that is not installed is skipped with a warning.

clear off
pin /Applications/WezTerm.app
