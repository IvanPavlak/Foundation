# Display language, locale and keyboard layout sets - DisplayLanguages, Locales, KeyboardLayouts,
# KeyboardLayoutSets and their Default* keys of Configuration(.local).psd1. Read by
# Display-SystemLanguageSettings, Set-DisplayLanguage, Set-Locale and Set-KeyboardLayouts.
#
#   display-language NAME CODE      a display language (AppleLanguages); CODE a language tag (en-US)
#   locale NAME CODE                a region for dates, numbers and units (the @rg= of AppleLocale);
#                                   CODE language-REGION (hr-HR), of which the region counts
#   keyboard-layout NAME ID         a keyboard layout by its input-source id
#                                   (com.apple.keylayout.US; Display-SystemLanguageSettings prints
#                                   the ids of the enabled ones)
#   keyboard-set NAME LAYOUT...     a named, ordered set of keyboard-layout names; the first is
#                                   the one selected
#   default-display-language NAME   what Enter picks in the Set-DisplayLanguage menu
#   default-locale NAME             what Enter picks in the Set-Locale menu
#   default-keyboard-set NAME       what Enter picks in the Set-KeyboardLayouts menu
#
# NAME is one word. A later line for the same NAME replaces an earlier one, so the overlay can
# change a base entry, and every line may start with @TYPE (machines.conf). The base ships no
# entries: the commands change nothing until a fork configures them in language.local.conf, e.g.
#
#   display-language          English-US   en-US
#   locale                    Croatian     hr-HR
#   keyboard-layout           Croatian     com.apple.keylayout.Croatian-PC
#   keyboard-layout           US           com.apple.keylayout.US
#   keyboard-set              Croatian-US  Croatian US
#   default-display-language  English-US
#   default-locale            Croatian
#   default-keyboard-set      Croatian-US
