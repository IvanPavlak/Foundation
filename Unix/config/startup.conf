# Startup tasks - commands this Mac runs on its own (the Startup tasks of WinuX),
# at sign-in or when a terminal opens. Read by Invoke-StartupTasks (run the tasks of a
# trigger), Invoke-StartupTask (run one) and Set-StartupTasks (the LaunchAgent behind SignIn). Ships
# with NO task, so nothing runs until startup.local.conf adds one. startup.local.conf is layered
# over this file: its lines before the first section are added (a condition of yours joins
# Network), its [Task] replaces a task of the same name here, `-LINE` takes a line back.
#
# Before the first section:
#   failure-report tab|none      after a sign-in run in which a task failed, was skipped or timed
#                                out, one terminal tab lists them (tab, the default) or nothing does
#   condition NAME [TIMEOUT [INTERVAL]] TEST
#                                a named test a task can require: TEST is a bash command line, met
#                                when it exits 0 (the condition of an `if`; its output is not
#                                shown), run every INTERVAL seconds (default 2) until it is met or
#                                TIMEOUT seconds (default 60; 0 tests once) have passed
#
# [Name]                         one task, run in the order written; letters, digits, - and _.
#                                Every line is a flag of Invoke-StartupTask:
#   command CMD                  the command line to run, by bash with Foundation's PATH (the
#                                commands work, the aliases of the shell rc do not). Without one the
#                                task only opens a terminal. It has failed when it exits non-zero
#   trigger SignIn|TerminalOpen  required; one or several (a line each, or space-separated). Unlock,
#                                Wake and Boot have no trigger on macOS
#   machine TYPE...              the machine types (machines.conf) it runs on; absent: every type
#   host NAME...                 the host names it runs on; with machine, both must match
#   requires CONDITION...        the conditions it waits for before the command
#   window tab|hidden            where a sign-in run happens (default tab: a WezTerm tab in the
#                                FoundationStartup window); a TerminalOpen run is always inline,
#                                in the shell that just opened. A hidden task cannot script other
#                                apps (no Automation consent at sign-in): use a tab for those
#   keep-open on-failure|always|never
#                                whether the task's tab stays (default on-failure; always for a
#                                task without a command)
#   parallel on                  start it and go on to the next task without waiting for it
#   frequency every-time|once-per-boot|once-per-day|interval
#                                default every-time. Only a run that succeeded counts, so a failed
#                                or skipped task is due again at the next trigger
#   day-start-hour N             once-per-day: the hour (0-23) a new day starts (default 6)
#   interval-hours N             interval: hours between two successful runs (default 24)
#   elevation prompt             sudo asks once in the task's tab before the command (needs a tab;
#                                not with TerminalOpen). Absent: no elevation
#   timeout SECONDS              how long the sign-in run waits for the task before it moves on
#                                (default 600; 0 waits without limit). The task is never stopped
#   enabled off                  parks the task
#   @TYPE ...                    any line: only on that machine type (machines.conf)
#
# Example (startup.local.conf):
#   condition MyVpn 120 2 scutil --nc status MyVpn | grep -q '^Connected'
#   [RepositoryUpdate]
#   command   Update-Repositories --all --no-clone --quiet || true
#   trigger   SignIn TerminalOpen
#   requires  Network
#   frequency once-per-day
#   window    tab
# (Update-Repositories exits 1 when a repository needs attention; `|| true` keeps that from
# failing the task, which would run it again in every new terminal.)

failure-report tab
# A default route exists: the Mac is on a network. Sends nothing anywhere.
condition Network 60 2 route -n get default
