# Repositories - the RepositoryGroups list of Configuration.psd1, read by Update-Repositories.
# Converted 2026-09-26; hand-maintained from here on.
#
#   base URL                  prefix for every relative repository path (Universal.GitHub.Base)
#   [Group]                   a repository group (the menu and `Update-Repositories GROUP`)
#   NAME PATH-OR-URL DIR [shallow]
#                             one repository: a path under base (/Owner/Repo.git) or a full URL,
#                             cloned into DIR when missing, updated safely otherwise; `shallow`
#                             clones it --depth 1 (a large history; it can still commit and push),
#                             in Update-Repositories and Initialize-Repository alike
#
# Repository update - the RepositoryUpdate section of Configuration(.local).psd1:
#   include-default-branch on|off   also fast-forward each default branch while another branch
#                                   is checked out (Update-Repositories; off by default)
#   default-branch NAME             the default branch of every repository; unset = each
#                                   repository's own (origin/HEAD)
#   startup on|off                  update automatically (Invoke-StartupRepositoryUpdate; off by
#                                   default), never cloning
#   startup-schedule daily|interval daily (default): once a day - the first shell after the day
#                                   starts, or the next prompt of a shell already open (a Mac
#                                   woken from sleep); interval: at most once per N hours, when a
#                                   shell starts
#   startup-day-start-hour N        daily: the hour (0-23) a new day starts (default 6; any
#                                   other value is 6)
#   startup-interval-hours N        interval: at most once per N whole hours (default 24; any
#                                   other value is 24)
#   startup-scope All|GROUP...      the groups it updates; group names only - a name that is no
#                                   group (a repository's included) updates nothing. Without a
#                                   line for this machine type: the repository-scope of
#                                   bootstrap.conf (what Bootstrap updates), then All
#   @TYPE ...                       any of these lines: only on that machine type (machines.conf)

base https://github.com

startup-schedule daily
startup-day-start-hour 6

[Private]
Dotfiles                           /IvanPavlak/Foundation.git                   $DOTFILES_ROOT
