# Retention of the unified backup sink Backups/Unix (gitignored) - Backups.Retention of
# Configuration.psd1. Read by Clear-OldBackups and after every backup. 0 disables a limit;
# whatever the limits, the newest backup of every key is never deleted.
#
#   max-age-days N          delete backups older than N days (off: replaced originals are precious)
#   max-backups-per-key N   keep the N newest backups per key
#   max-total-size-mb N     cap the whole sink, oldest removed first

max-age-days          0
max-backups-per-key   10
max-total-size-mb     500
