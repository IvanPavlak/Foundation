# Package pins - the Version column of WinuX's app lists: the packages Upgrade-All must leave at
# the version they have, written into each package manager's own pin so a hand-run upgrade
# respects them too.
#
#   brew FORMULA          keep this Homebrew formula where it is (`brew pin`). Upgrade-All pins it
#                         before `brew upgrade`, and unpins a formula of the bundled Brewfiles that
#                         is pinned but has no line here any more. A pin on a formula no Brewfile
#                         names was made by hand and is left alone. Homebrew pins the INSTALLED
#                         version (it cannot install an arbitrary one), and casks cannot be pinned
#
# Personal: the base ships no pin; a fork lists its own in package-pins.local.conf (`-brew
# FORMULA` takes a line back, `@TYPE` limits one to machine types).
#
# brew node
