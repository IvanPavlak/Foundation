# D&D campaigns for Open-DnD - CampaignResources of Configuration(.local).psd1, in menu order.
#
#   [Campaign]
#   pdf GROUP        a group of config/pdfs.conf (the character sheet), opened with Open-Acrobat
#   browser GROUP    a group of config/browser-groups.conf (the spell list), opened with Open-Browser
# One pdf and one browser line per campaign; with several, the last one wins.
#
# Example:
#   [MyCampaign]
#   pdf      MyCharacter
#   browser  MySpells
