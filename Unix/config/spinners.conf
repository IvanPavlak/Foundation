# Loading spinner styles - LoadingSpinners and DefaultSpinner of Configuration.psd1. Read by the
# spinner of lib/spinner.sh (long waits: Docker, the layout's wait for windows) and
# Loading-Spinner.
#
#   default STYLE                  the style every wait uses
#   STYLE DELAY-MS FRAME...        one style: milliseconds per frame, then the frames
#
# The last line of a name wins (default and styles alike), so a spinners.local.conf line with a
# base style's name replaces that style.

default  Dots

# The 19 LoadingSpinners of WinuX's base, verbatim (frames and delays), then Bounce, a Unix extra.
