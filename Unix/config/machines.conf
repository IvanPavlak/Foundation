# Machine types - HostnameToMachineType, DefaultMachineType, SmallDisplayMachineType and
# LayoutMachineTypeOverrides of Configuration.psd1.
#
#   type NAME                   a valid machine type (ValidMachineTypes), one line each; chezmoi
#                               offers them on the first run and Test-ConfigurationSchema rejects
#                               any other type named here or in an @TYPE prefix
#   host HOSTNAME TYPE          `scutil --get LocalHostName` (or `hostname -s`) -> machine type
#   default TYPE                when no host line matches and MACHINE_TYPE is unset (else Test)
#   small-display TYPE          layout set (and window.conf row) used when the primary display
#                               is at most small-display-width points wide (the built-in Retina
#                               panel)
#   small-display-width POINTS  default 3000, as on Windows
#   layout-override TYPE OTHER  machine TYPE always uses OTHER's layout files and window.conf
#                               rows. OTHER (like the small-display target) is a layout set: a
#                               machine type or any layouts/OTHER/ folder, so a set such as Temp
#                               for a temporary monitor needs no type line (as on Windows)
#   dev-root PATH               the dev root (BasePaths.<Type>.Dev), named $DEV in any configured
#                               path ($DEV/MyRepo); `@TYPE dev-root` per machine type. Without
#                               one it is the folder holding this clone, as on Windows
#
# A fork lists its own types, Macs, dev roots and layout rules in machines.local.conf, which
# Initialize-Configuration (the first Bootstrap step) writes on a fresh clone.

type Test
default                  Test
small-display-width      3000
