# VS Code multi-root workspaces - Projects.Self.VSCodeWorkspaces and DefaultVSCodeWorkspaces of
# Configuration(.local).psd1. Read by Open-VSCodeWorkspace and Open-Workspace.
#
#   directory PATH            the folder of *.code-workspace files, addressed by base name
#   default WORKSPACE NAME    `w WORKSPACE` opens NAME.code-workspace IN PLACE OF the project
#                             folder its Open-VSCode action would open; `w X --vscode-workspace
#                             NAME` does the same for one run, a bare --vscode-workspace shows
#                             the menu

directory $DOTFILES_ROOT/VSCode/Workspaces
