# Docker - DockerComposeFiles, DockerTimeouts, DockerCleanupActions and DockerCleanupStartMode of
# Configuration.psd1.
#
#   directory PATH                 where a relative stack FILE resolves (DockerDirectory):
#                                  relative to the repository root, ~ and $VARIABLES expand;
#                                  Docker without a line
#   stack NAME FILE                a Compose stack for Start-Containers, Run-Project and
#                                  DockerWizard; a relative FILE resolves under `directory`.
#                                  The last line of a NAME wins, so an overlay line replaces the
#                                  base stack of that name
#   timeout start|stop SECONDS     how long to wait for the Docker daemon to come up (the
#                                  commands that need it: Start-Containers, Docker-Cleanup,
#                                  Run-Project; Open-Docker never waits) / for Docker Desktop to quit
#                                  before it is killed (Open-Docker --stop, Kill-All); without a
#                                  line, the values below (start 180, stop 60)
#   cleanup LABEL :: COMMAND [:: CONFIRMATION]
#                                  a Docker-Cleanup menu entry; the menu adds All, and selected
#                                  entries run in the order listed here, so keep stops and
#                                  container deletes before images and volumes. With a
#                                  CONFIRMATION the run needs an explicit "yes" (Enter means no)
#   cleanup-description LABEL :: TEXT
#                                  optional - one sentence shown before the confirmation
#   cleanup-preview LABEL :: COMMAND
#                                  optional - lists what LABEL would stop or remove; an empty
#                                  list skips the action ("nothing to do")
#   cleanup-start ask|always|never what Docker-Cleanup does when the daemon is down: ask (default,
#                                  also for an empty or unknown value; Enter means yes), start
#                                  Docker without asking, or warn and stop
# A .local.conf adds its cleanup lines after these; take one back with -LINE.

directory          Docker

stack PostgreSQL   docker-compose.postgresql.yml

timeout start 180
timeout stop  60

cleanup-start ask

cleanup Stop all containers :: docker ps -q | xargs docker stop :: Are you sure you want to stop all running containers?
cleanup-description Stop all containers :: Stops every running container.
cleanup-preview Stop all containers :: docker ps --format '{{.Names}} ({{.Image}})'
cleanup Delete all containers :: docker ps -aq | xargs docker rm -f :: Are you sure you want to delete ALL containers?
cleanup-description Delete all containers :: Force-removes every container, running or stopped.
cleanup-preview Delete all containers :: docker ps -a --format '{{.Names}} ({{.Image}}, {{.Status}})'
cleanup Delete all images :: docker images -aq | sort -u | xargs docker rmi -f :: Are you sure you want to delete ALL images?
cleanup-description Delete all images :: Force-removes every image, including ones a container still uses.
cleanup-preview Delete all images :: docker images -a --format '{{.Repository}}:{{.Tag}} ({{.ID}}, {{.Size}})'
cleanup Delete all volumes :: docker volume ls -q | xargs docker volume rm :: Are you sure you want to delete ALL volumes?
cleanup-description Delete all volumes :: Removes every volume, named and anonymous, with the data in it.
cleanup-preview Delete all volumes :: docker volume ls --format '{{.Name}} ({{.Driver}})'
cleanup Prune networks and build cache :: docker network prune -f; docker builder prune -a -f :: Are you sure you want to prune unused networks and the build cache?
cleanup-description Prune networks and build cache :: Removes custom networks no container uses, and the whole build cache.
cleanup-preview Prune networks and build cache :: docker network ls --filter type=custom --format 'network: {{.Name}}'; docker system df --format '{{.Type}}: {{.Size}}' | grep '^Build Cache:' | grep -v ': 0B$'
