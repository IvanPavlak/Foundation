# Apps that start at login - the Startup apps of Windows. Read by Set-LoginItems (bootstrap step
# LoginItems), which talks to System Events: the first run asks to let the terminal control it.
#
#   item PATH [hidden]          start the app at login; hidden starts it without a window
#   @TYPE ...                   any line: only on that machine type (machines.conf)
#
# Items are only added, never removed; an app that is not installed is skipped with a warning.
# A PATH may contain spaces; put `hidden` last.

item /Applications/AeroSpace.app hidden
