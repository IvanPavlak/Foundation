# Workspaces - the WorkspaceActions list of Configuration.psd1, read by Open-Workspace (w).
# Converted 2026-09-25 from Configuration(.local).psd1; hand-maintained from here on.
#
# One [section] per workspace, one action per line, run top to bottom. An action is the name of
# a Foundation command (Unix/modules/*/bin) followed by its arguments, or an `Open-<App>` line for an app listed
# in config/apps.conf (the generic launcher). An action with neither is reported and skipped,
# and the rest of the workspace still opens - the same rule as the PowerShell port. `Return`
# stops the open there (later actions and workspaces are skipped), as on Windows.
# {Workspace} is the workspace's own name. {SelectedProjects} expands to the open's projects
# (`w <Workspace> X`, the up-front project menu, or the projects its Open-Project lines name).
# A line may start with a project scope: `+A,B LINE` runs only for those projects, `+!A,B LINE`
# only when none of them is selected. Before it, a layout-set scope: `%A,B LINE` runs only when the
# layout set this machine applies (layout-override, else small-display, else the machine type of
# machines.conf) is A or B - the LayoutMachine of Windows: `%Work Open-Browser --no-menu --instances 2`.
# A line ending in a lone `&` runs in the background (`Open-DBeaver &`): the open goes on with the
# next action and waits for it before the next Set-WorkspaceWindowLayout, Focus-VirtualDesktop,
# Terminate-WindowsTerminalTabs or Return. Only commands that just start apps, terminal tabs or
# containers may (an Open-<App>, Open-Project, Open-Obsidian, ...; see Open-Workspace --help).
#
# A section can instead stamp out a template of config/workspace-templates.conf under its own name:
#   template NAME                   the template
#   set NAME VALUE...               a variable value (w <Workspace> --name VALUE beats it for one open)
#   replace KEY LINE                swaps the template action KEY (its :ID, else its action name)
#   drop KEY                        removes it
#   add [before|after KEY] LINE     adds LINE; bare, just before the template's Set-WorkspaceWindowLayout
#
# The line before the first section names DefaultWorkspace (what a bare `w` opens).

default-workspace Default

# SimpleLayoutWorkspaces: layouts that are a global gesture instead of a placement - every window
# on every desktop full size (one accordion per desktop), no window moved to another desktop.
simple-layouts Fullscreen Empty

# WorkspaceBenchmark: `benchmark on` appends a row per open to
# $XDG_STATE_HOME/foundation/WorkspaceBenchmark.csv (Get-WorkspaceBenchmark); off, as without a
# line, records nothing. benchmark-display is what the end of an open shows: table (the
# workspace's last benchmark-history rows; the default), line (one Timing line) or none.
benchmark          off
benchmark-display  table
benchmark-history  10

# layout-early-move on: Set-WorkspaceWindowLayout moves each window to its desktop the moment it
# claims it (the Move-StableWindowEarly idea; AeroSpace's static on-window-detected rules cannot
# express it, because one app goes to different desktops in different workspaces). off: every
# window is moved once all have appeared. The mode is recorded in each benchmark row.
layout-early-move off

# layout-stable-ms N: how long a claimed window's title must hold before the layout treats it as
# ready (browsers retitle while loading). Lower is faster, too low can place a window before its
# title settled on the one the layout wants. Measure-WorkspaceOpen varies it.
layout-stable-ms 500

# layout-absent-grace-seconds N: after N seconds the layout stops waiting for a window whose app
# is not running, or whose only matching windows belong to another workspace (the
# ProcessAbsentGraceSeconds of Windows), so a missing app costs N seconds, not the whole timeout.
# 0 waits the whole timeout.
layout-absent-grace-seconds 10

[Example]
Open-Browser --no-menu --instances 33
Set-WorkspaceWindowLayout Example
Focus-VirtualDesktop 1

[Test]
Open-DBeaver
Open-VMWare
Open-WhatsApp
Open-Browser YouTube News AI Calendar Email
Set-WorkspaceWindowLayout Test
Focus-VirtualDesktop 1

[Fullscreen]
Set-WorkspaceWindowLayout Fullscreen
Focus-VirtualDesktop 1

# Empty closes no tab and Default every tab, the calling one last, as in WinuX's base.
[Empty]
Set-WorkspaceWindowLayout Empty
Focus-VirtualDesktop 1

[Default]
Open-Browser Google YouTube
Set-WorkspaceWindowLayout Default
Focus-VirtualDesktop 1
Terminate-WindowsTerminalTabs --include-current

[SecureBrowser]
Open-SecureBrowser
Set-WorkspaceWindowLayout SecureBrowser
Focus-VirtualDesktop 1
