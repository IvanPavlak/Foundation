# Claude Code plugin marketplaces - AiMarketplaces of Configuration(.local).psd1. Read by Deploy-AiMarketplaces.
#
# One [section] per marketplace, named as Claude Code knows it (the `name` of its
# .claude-plugin/marketplace.json); its plugins are installed as <plugin>@<section>:
#   repository OWNER/NAME     the GitHub repository carrying the marketplace
#   plugins PLUGIN...         plugins to install from it (leave out to register the marketplace alone)
#   env NAME VALUE            one variable its plugins need Claude Code to read from the env block of
#                             ~/.claude/settings.json (every other variable kept); VALUE is text, the
#                             rest of the line; a later section's value wins the same NAME
#   option PLUGIN KEY VALUE   one option of PLUGIN, written to pluginConfigs.<plugin>@<section>.options
#                             (the option lines replace that key whole); VALUE is JSON when it
#                             parses (true, 60, ["a","b"]), else the text itself
#   config PLUGIN CHILD VALUE any other key of the plugin's entry, pluginConfigs.<plugin>@<section>.<CHILD>
#                             (VALUE as for option)
#
# A [plugin:NAME] section configures a plugin no marketplace installs (a folder-loaded mod of
# ai-artifacts.conf) beneath pluginConfigs.<NAME>, with `option KEY VALUE` and `config CHILD VALUE`
# lines (the plugin named by the section).
#
# A plugin installed from a marketplace must not also be vendored as a mod through ai-artifacts.conf: the two
# loading paths would run it twice.
#
# Example:
#   [my-marketplace]
#   repository  OWNER/NAME
#   plugins     my-plugin
