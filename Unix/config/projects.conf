# Projects - ProjectActions, ProjectTerminals and RunnableProjectMappings of Configuration.psd1,
# read by Open-Project, Open-ProjectTerminals and Run-Project (rp).
# Converted 2026-09-25 from Configuration(.local).psd1; hand-maintained from here on.
#
#   path KEY DIR        a named directory of the project (ROOT, API, UI, ...)
#   action ...          ProjectActions, run in order by Open-Project; {ProjectName} in the line is
#                       the project's name (action Open-VSCode {ProjectName})
#   tab KEY [DIR]       ProjectTerminals: one WezTerm tab titled <Project>.<KEY>, in path KEY
#                       (or DIR when given; DEFAULT = the home directory). The Windows name-only
#                       tab (@{ Key = "Name" }) is `tab Name ~`; a KEY with neither DIR nor a
#                       path line is skipped and reported, so a mistyped key is caught
#   run KEY COMMAND...  RunnableProjectMappings: what Run-Project types into tab KEY (a KEY
#                       without a tab line runs nothing, as on Windows)
#   docker TARGET       containers Run-Project starts first: a stack of docker.conf
#                       (DatabaseProviders) or a path KEY whose directory holds the project's own
#                       compose file (UsesDocker). Of several stacks only one starts, chosen with
#                       Run-Project --database-provider NAME or its menu (Enter: the first)
#
#   step Docker on|off  before the first section: whether Run-Project's Docker step runs when
#                       neither --skip Docker nor --include Docker is given (RunProject.Steps;
#                       on when absent, the last line wins)
#
# KEY compares case-insensitively. DIR may start with ~ and may use $VARIABLES
# ($DOTFILES_ROOT is always set). WSL tabs of the Windows side have no macOS equivalent.

# The repository itself, as WinuX's base self project: a ROOT tab and a DOCS tab running the docs
# server.
[Dotfiles]
path ROOT $DOTFILES_ROOT
path DOCS $DOTFILES_ROOT/docs
action Open-VSCode Dotfiles
action Open-ProjectTerminals Dotfiles
tab ROOT
tab DOCS
run DOCS npx docsify-cli serve

# A showcase project, as WinuX's base ExampleProject: an API and a UI folder under the dev root,
# each in its own tab; Run-Project starts the PostgreSQL stack of docker.conf, then runs both
# (dnr: dotnet run, nir: npm install and start).
[ExampleProject]
path ROOT $DEV/ExampleProject
path API $DEV/ExampleProject/src/Api
path UI $DEV/ExampleProject-UI
action Open-VSCode {ProjectName}
action Open-ProjectTerminals {ProjectName}
tab API
tab UI
run API dnr
run UI nir
docker PostgreSQL
