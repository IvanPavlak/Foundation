# Special folders - SpecialFolders of Configuration(.local).psd1. Read by Set-SpecialFolders
# (Bootstrap's SpecialFolders step).
#
#   folder Downloads PATH     ~/Downloads becomes a link to PATH, so every app that saves to
#                             Downloads (browsers, Mail, AirDrop) saves there - the registry
#                             redirect of Windows. What ~/Downloads holds moves to PATH first; a
#                             name PATH already has is kept beside it as "NAME (Downloads)". The
#                             deny-delete rule macOS puts on ~/Downloads is removed from the
#                             emptied folder (Set-SpecialFolders --help shows how to undo it).
#   folder Screenshots PATH   where screenshots are saved (com.apple.screencapture location)
#
# ~ and $VARIABLES expand; every line may start with @TYPE (machines.conf). The base redirects
# nothing; a fork adds its lines in special-folders.local.conf, e.g.
#
#   folder Downloads    ~/Desktop
#   folder Screenshots  ~/Desktop
