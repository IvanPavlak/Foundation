# Window sizing and titles - CenterTerminalSizing, ResizeWindowsPercent and the problem-page pattern
# of Configuration(.local).psd1. Read by Center-Terminal (and Kill-All's CenterTerminal step),
# Resize-Windows, Open-ProjectSwagger and Close-Project.
#
#   center-terminal ROW WIDTH HEIGHT MIN-W% MAX-W% MIN-H% MAX-H%
#       the terminal's target size in points, turned into shares of the primary display's work
#       area and clamped to the percent bounds, so it looks the same on a laptop panel and a large
#       monitor. Windows reads the same numbers as pixels.
#   resize-windows ROW PERCENT
#       what Resize-Windows scales by without --percent; 10-500 (a fraction is rounded), anything
#       else (or no row) gives 70.
#   problem-page-title TEXT
#       the title a browser gives a page that failed to load (BrowserGroupMatching.Matching.
#       ProblemLoadingPagePattern of Windows), a plain text matched case-insensitively: while a
#       project's backend is down, Open-ProjectSwagger counts a browser window with this title as
#       the project's Swagger tab, and Close-Project closes such tabs for a project whose Swagger
#       URL is on this machine. Without the line: Problem loading page (Firefox's).
#
# ROW is SmallDisplay (a primary display at most small-display-width points wide, machines.conf),
# a machine type or Default, tried in that order, as the display-aware sections of Windows. The
# machine type is the layout machine type of machines.conf: layout-override, then small-display,
# then the machine type itself.

center-terminal  Default  1376 700  25 72  35 75
resize-windows   Default  70
problem-page-title  Problem loading page
