# AI harnesses - the apps Deploy-AiArtifacts can deploy into, one [section] each. The catalogue is
# inactive: a `deploy` line of ai-artifacts.conf turns a harness on. A fork defines another app with
# its own section in ai-harnesses.local.conf (a section there replaces a same-named one here).
# Design and the documentation each destination was checked against: docs/foundation/ai.md.
#
# One line per destination (every line may start with @TYPE, machines.conf):
#   KIND PLACEMENT FILES [+HOOK...] PATH
#     KIND        skills, mods, rules, prompts or agents
#     PLACEMENT   each   PATH is a folder; one link per item
#                 copy   as each, but the item is copied (for an app that does not follow links)
#                 file   PATH is one file, linked to the item a `use KIND NAME` line names
#     FILES       what to take from an item folder, comma-separated, the first one the item has:
#                 `.` is the folder itself (linked as <item>), a file name is that file (linked as
#                 <item> plus the file's extension, claude.md as <item>.md, copilot.agent.md as
#                 <item>.agent.md); an item with none of them is left out of this destination
#     +HOOK       a built-in step for this destination: +claude-plugin-dirs lists the links in
#                 env.CLAUDE_CODE_PLUGIN_DIRS of ~/.claude/settings.json and validates them with
#                 `claude plugin validate`; +managed-settings makes the link through sudo (a
#                 root-owned path)
#     PATH        the rest of the line (spaces allowed); ~ and $VARIABLES expand
#
# Two harnesses naming one destination (~/.agents/skills) share it: it is filled once.
#
# T3 Code has no section: it drives the agents installed on the Mac (Claude Code, Codex, ...),
# which read their own folders, so turning those on covers it.

[claude-code]
skills   each  .                                 ~/.claude/skills
mods     each  .        +claude-plugin-dirs      ~/.claude/mods
rules    file  RULES.md                          ~/.claude/CLAUDE.md
rules    file  managed-settings.json  +managed-settings  /Library/Application Support/ClaudeCode/managed-settings.json
prompts  each  claude.md,PROMPT.md               ~/.claude/commands
agents   each  claude.md,AGENT.md                ~/.claude/agents

[codex]
skills   each  .                                 ~/.agents/skills
rules    file  RULES.md                          ~/.codex/AGENTS.md
prompts  each  codex.md,PROMPT.md                ~/.codex/prompts
agents   each  codex.toml                        ~/.codex/agents

[gemini-cli]
skills   each  .                                 ~/.agents/skills
rules    file  RULES.md                          ~/.gemini/GEMINI.md
prompts  each  gemini.toml                       ~/.gemini/commands
agents   each  gemini.md,AGENT.md                ~/.gemini/agents

[copilot]
skills   each  .                                 ~/.agents/skills
rules    file  copilot.md,RULES.md               ~/.copilot/copilot-instructions.md
agents   each  copilot.agent.md                  ~/.copilot/agents
