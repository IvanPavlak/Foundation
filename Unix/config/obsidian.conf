# Obsidian - Configuration.Obsidian, MachineSpecificPaths.ObsidianDirectory and the Obsidian link of
# SymbolicLinks in Configuration(.local).psd1. Read by Open-Obsidian, git-obsidian and Bootstrap's
# ObsidianSettings step.
#
#   directory PATH            the vault folder (~ and $VARIABLES expand); OBSIDIAN_DIRECTORY in
#                             the environment wins
#   vault NAME                the vault the CLI addresses (default: the folder name of the
#                             vault directory)
#   default-workspace NAME    the saved Obsidian workspace a cold start loads when nothing else
#                             chose one (empty: Obsidian restores its last layout)
#   settings PATH             the repository folder the vault's .obsidian links to (hotkeys,
#                             plugins, saved workspaces), relative to the repository root or
#                             absolute; Bootstrap's ObsidianSettings step makes the link. No line:
#                             the vault keeps its own .obsidian
#
# vault and default-workspace are empty on Windows too; set them to opt in. A generic clone ships
# no Obsidian settings folder, so settings stays a fork's line:
#
#   settings Obsidian/.obsidian

directory ~/Documents/Obsidian
