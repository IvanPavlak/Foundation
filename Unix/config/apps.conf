# Applications known to the Unix half - bundle ids per app token (the Windows side knows them
# by exe name; the removed PowerShell port kept this as MacOSApplicationMap).
#
#   app TOKEN BUNDLE-ID [BINARY]        a GUI application. TOKEN is what layouts, workspaces and
#                                       Kill-All name it by; BUNDLE-ID is its CFBundleIdentifier
#                                       (osascript -e 'id of app "Name"'); BINARY is the direct
#                                       executable, needed only by launchers that must hand
#                                       arguments to a running instance (browsers).
#   browser TOKEN NEW-WINDOW-ARG [PRIVATE-ARG] [launch=open|launch=script]
#                                       browser launch arguments (Universal.Browsers).
#                                       launch=open starts the browser through LaunchServices
#                                       (open -na) instead of running its binary: Chromium
#                                       browsers run from a terminal's process are refused access
#                                       to their own profile folder by macOS ("SingletonLock:
#                                       Operation not permitted") and abort. Firefox keeps the
#                                       direct binary, which hands URLs to a running instance.
#                                       launch=script opens a window of URLs through the
#                                       browser scripting driver (Safari, which takes no
#                                       new-window arguments; its arguments are `-`)
#   role ROLE TOKEN...                  a role token stands for any of its members in layouts:
#                                       Terminal is the orchestrated terminal (WindowsTerminal on
#                                       Windows), Browser any configured browser
#   default-browser TOKEN               Universal.DefaultBrowser
#
# Every app line also enables the generic `Open-<TOKEN>` workspace action (open -b BUNDLE-ID,
# skipped when AeroSpace lists a window of the app) and lets Kill-All quit the app by id.
#
# When several app, browser or role lines name the same token (any case), the last one wins, as
# for default-browser: an apps.local.conf line overrides the base line of its token, no -LINE
# needed. A browser line is read whole: an overriding line without launch= starts the binary.

app Code             com.microsoft.VSCode
app Claude           com.anthropic.claudefordesktop
app T3Code           com.t3tools.t3code
app WezTerm          com.github.wez.wezterm
app Ghostty          com.mitchellh.ghostty
app Firefox          org.mozilla.firefox                 /Applications/Firefox.app/Contents/MacOS/firefox
app Chrome           com.google.Chrome                   /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
app Brave            com.brave.Browser                   /Applications/Brave Browser.app/Contents/MacOS/Brave Browser
app Edge             com.microsoft.edgemac               /Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge
app TorBrowser       org.torproject.torbrowser           /Applications/Tor Browser.app/Contents/MacOS/firefox
app Safari           com.apple.Safari
app Obsidian         md.obsidian
app WhatsApp         net.whatsapp.WhatsApp
app Mail             com.apple.mail
app DBeaver          org.jkiss.dbeaver.core.product
app Discord          com.hnc.Discord
app Acrobat          com.adobe.Reader
app Slack            com.tinyspeck.slackmacgap
app Steam            com.valvesoftware.steam
app TeamViewer       com.teamviewer.TeamViewer
app VirtualBox       org.virtualbox.app.VirtualBox
app VMware           com.vmware.fusion
app Finder           com.apple.finder
app Docker           com.docker.docker
app OBS              com.obsproject.obs-studio

browser Firefox      -new-window     -private-window
browser TorBrowser   -new-window     -private-window
browser Chrome       --new-window    --incognito    launch=open
browser Brave        --new-window    --incognito    launch=open
browser Edge         --new-window    -inprivate     launch=open
browser Safari       -               -              launch=script

role Terminal        WezTerm
role Browser         Firefox Chrome Brave Edge TorBrowser Safari

default-browser      Firefox
