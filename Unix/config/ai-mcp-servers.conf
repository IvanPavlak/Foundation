# MCP servers - AiMcpServers of Configuration(.local).psd1. Read by Deploy-AiMcpServers.
#
# Before the first section (every line may start with @TYPE, machines.conf):
#   deploy APP...             the apps this machine adds the servers to: claude-code, codex; the
#                             last line for this machine type wins, so write the untagged line
#                             first and @TYPE lines after it (none: nothing is deployed)
#
# One [section] per server, named as both apps list it (letters, digits, - and _). Either a remote
# server:
#   url URL                   the server's http(s) address
#   transport sse             an SSE server (default http, streamable HTTP); Codex reads no SSE
#                             servers, so one reaches Claude Code only
#   header NAME VALUE         one HTTP header; VALUE is the rest of the line
#   bearer-token-env NAME     the environment variable holding a token: Claude Code gets an
#                             `Authorization: Bearer ${NAME}` header, Codex bearer_token_env_var;
#                             never write the token itself here
# or a server that runs on the machine (stdio):
#   command PATH              the executable; PATH is the rest of the line
#   arg VALUE                 one argument, in order; VALUE is the rest of the line
#   env NAME VALUE            one variable the server reads
# and, for either:
#   machine TYPE...           only on these machine types (an @TYPE prefix on a line works too)
#
# A server that signs in with OAuth (most remote ones) needs the sign-in once per machine: /mcp in
# Claude Code, `codex mcp login <name>` in Codex. Servers are added and updated, never removed.
#
# Example:
#   deploy claude-code codex
#
#   [my-remote]
#   url               https://mcp.example.com/mcp
#
#   [my-local]
#   command           npx
#   arg               -y
#   arg               my-mcp-server
#   env               LOG_LEVEL info
