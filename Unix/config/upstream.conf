# Upstream path ownership - which paths of this repository Foundation owns. Read by Merge-Upstream.
#
# Foundation ships the macOS half of a WinuX-shaped repository, so a fork can take it from two
# upstreams: WinuX for the Windows half and the shared files, Foundation for everything below. A
# merge from Foundation with --owned-only then takes only these paths and puts every other path
# back as the fork has it.
#
#   own PATH              a path Foundation owns: a folder ends in / and covers everything under it,
#                         any other PATH is one file
#   mirror PATH           a WinuX file Foundation ships byte-identical and never edits; a fork takes
#                         it from WinuX, so a Foundation merge that changes one says so
#   owned-only REMOTE...  merges from these remotes take only the `own` paths, as if --owned-only
#                         were given (--all-paths overrides it for one run). The base ships none:
#                         a fork of Foundation alone takes every path; a fork of both upstreams
#                         names its Foundation remote in upstream.local.conf (owned-only macupstream)
#
# A line may start with @TYPE to apply on one machine type only. A fork adds its own lines in
# upstream.local.conf; -LINE takes a base line back.

own Unix/
own docs/unix/
own .github/workflows/unix.yml
own AI/Context/UNIX_CONTEXT.md
own AI/Instructions/ShellConventions.md
own AI/Skills/foundation/
own AI/Rules/example/
own FastFetch/Unix/
own Git/Unix/
own Btop/Unix/
own Btop/themes/
own WezTerm/

mirror Git/.gitconfig
mirror Oh-My-Posh/WinuX_Test.omp.json
mirror Wallpapers/Black.jpg
mirror Wallpapers/White.png
mirror LazyGit/config.yml
mirror LazyDocker/config.yml
mirror Docker/docker-compose.postgresql.yml
mirror NuGet/nuget.config
mirror Firefox/user.js
mirror AI/Instructions/DocumentationStyle.md
mirror AI/Instructions/OutputFormatting.md
mirror LICENSE
mirror CODE_OF_CONDUCT.md
