# Upstream manifest - which paths of a repository holding Foundation are Foundation's. Read by
# Merge-Upstreams (and by its PowerShell twin in WinuX), from the commit it merges, never from the
# working tree; see docs/foundation/fork-model.md.
#
# A fork can merge several projects into one repository (WinuX for Windows, Foundation for the Mac).
# Each project ships one manifest like this one. On a merge from Foundation every changed path is
# handled by one rule: a path under an `own` line is always taken, a `mirror` file is taken (it is
# byte-identical in every upstream), and every other path is the hallway, taken only when the fork's
# root owner is Foundation (Git/upstreams.local.conf, `root-owner`; default: the only upstream, else
# `fork`).
#
#   name NAME          the project's name and the name of its remote in a fork (git remote add NAME URL)
#   url URL            the project's repository; the remote whose fetch URL matches it is used, under any name
#   tag-prefix PREFIX  the project tags its releases PREFIX/vX.Y.Z, so the tags of two upstreams never clash
#   changelog PATH     the project's changelog; its newest `## [x.y.z]` names the merge in the suggested message
#   own PATH           a path only Foundation ships (repeatable)
#   mirror PATH        a file every upstream ships byte-identical, by contract (repeatable)
#
# A PATH ending in / covers everything under it; any other PATH is one file. Plain KEY VALUE lines:
# no @TYPE (a manifest is not per machine) and no upstream.local.conf overlay (a fork's own choices
# go in Git/upstreams.local.conf).

name        foundation
url         https://github.com/IvanPavlak/Foundation.git
tag-prefix  foundation
changelog   Unix/CHANGELOG.md

own         Unix/
own         docs/foundation/
own         .github/workflows/foundation.yml
own         .github/workflows/foundation-release.yml
own         AI/Context/UNIX_CONTEXT.md
own         AI/Instructions/ShellConventions.md
own         AI/Skills/foundation/
own         FastFetch/Unix/
own         Git/Unix/
own         Btop/Unix/
own         Btop/themes/
own         WezTerm/

mirror      LICENSE
mirror      CODE_OF_CONDUCT.md
mirror      Git/.gitconfig
mirror      Oh-My-Posh/WinuX_Test.omp.json
mirror      Wallpapers/Black.jpg
mirror      Wallpapers/White.png
mirror      LazyGit/config.yml
mirror      LazyDocker/config.yml
mirror      Docker/docker-compose.postgresql.yml
mirror      NuGet/nuget.config
mirror      Firefox/user.js
mirror      AI/Instructions/DocumentationStyle.md
mirror      AI/Instructions/OutputFormatting.md
mirror      AI/Rules/example/CoreAiRules/RULES.md
mirror      Backups/.gitkeep
