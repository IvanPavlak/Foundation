# Wake-on-LAN machines - WakeOnLanConfig and DefaultWakeOnLanMachine of Configuration.psd1,
# read by Send-WakeOnLan. Converted 2026-09-26.
#
#   default NAME                                 machine for `Send-WakeOnLan` in a workspace action
#   [Name]                                       one machine (the menu follows file order)
#   mac MAC                                      its MAC address (- or : separated)
#   broadcast ADDRESS                            subnet broadcast address the packet goes to
#   port PORT                                    UDP port, usually 9
#   address HOST                                 optional: pinged before (skip when already up)
#                                                and after (wait until it answers)
#
# Example:
#   default Server
#   [Server]
#   mac        AA-BB-CC-DD-EE-FF
#   broadcast  192.168.1.255
#   address    192.168.1.10
#   port       9
