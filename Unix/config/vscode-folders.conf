# VS Code folders - the VSCodeProjects list of Configuration.psd1, read by Open-VSCode.
#
#   NAME DIR     DIR may start with ~ and use $VARIABLES. When several lines have the NAME (any
#                case), the last one gives the folder, so a vscode-folders.local.conf line
#                overrides the base line; the menu lists each name once.

Dotfiles                         $DOTFILES_ROOT
ExampleProject                   $DEV/ExampleProject
