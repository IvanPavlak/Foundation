# .NET settings of Install-DotnetEf, Configure-NuGetConfig and Determine-DotnetDependencies (the
# Unix counterpart of the Windows DotnetEFVersion, MachineSpecificPaths.NuGetConfig and
# DotnetProjectsSearchPath).
#
#   ef-version VERSION     dotnet-ef version to install: 8.0.11, 8.* or empty for the latest
#   sdk-channel CHANNEL    a .NET SDK channel no Homebrew cask ships (6.0), installed by
#                          Install-DotnetSdks (Bootstrap step DotnetSdks) next to the cask SDKs;
#                          one line per channel, none in the base
#   nuget-template PATH    NuGet config template with [Username] and [Token] placeholders;
#                          default NuGet/nuget.config (relative to the repository root)
#   nuget-config PATH      where the filled-in config goes; default ~/.nuget/NuGet/NuGet.Config
#                          (a relative path starts at the repository root)
#   projects-search-path PATH  where Determine-DotnetDependencies looks for projects
#                          (DotnetProjectsSearchPath); default the dev root, $DEV
#
# ~ and $VAR expand in paths. A line may start with @TYPE to apply on one machine type only.
ef-version
nuget-template NuGet/nuget.config
nuget-config ~/.nuget/NuGet/NuGet.Config
