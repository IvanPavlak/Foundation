# Bootstrap steps and the values of its inline steps (the Unix counterpart of the Windows
# BootstrapConfig). bootstrap.local.conf is layered over this file: its `step` lines win, its
# sections replace same-named sections here.
#
#   step NAME on|off    turns a step on or off; without a line the built-in default applies
#                       (Bootstrap --list shows every step, its default and its state)
#   repository-scope All|GROUP...
#                       the repositories.conf groups the RepositoryUpdate step updates (space-
#                       or comma-separated; the last line for this machine type wins; All, or no
#                       line, updates every repository). Group names only: a name that is no
#                       group (a repository's included) updates nothing and fails the step.
#                       The automatic update takes this scope too unless repositories.conf has
#                       a startup-scope line for this machine type.
#
# `step` and `repository-scope` lines go before the first section. Defaults follow the Windows rule: on when the step
# is idempotent or does nothing on an empty config, off when it acts at once, prompts or needs
# root. RenameMachine and Permissions run only with --with-initial-setup.
#
# [Packages]        trust TYPE NAME   a third-party tap entry Homebrew must trust before brew
#                                     bundle loads it (brew trust --TYPE NAME)
#                   brewfile PATH     a Brewfile to bundle, in order (relative to the repository
#                                     root); without one: Unix/Brewfile, then Unix/Brewfile.local
# [Spotlight]       index VOLUME on|off   Spotlight indexing of a volume (sudo mdutil -i)
# [Firewall]        KEY on|off        socketfilterfw --setKEY: globalstate, stealthmode,
#                                     allowsigned, allowsignedapp (sudo)
# [SoftwareUpdate]  defaults DOMAIN KEY TYPE VALUE   a machine-wide preference (sudo defaults write)
# [PersonalSteps]   COMMAND [ARG...]  a fork's own step (BootstrapConfig.PersonalSteps), run in
#                                     order by the PersonalSteps step: a Foundation command or any
#                                     command on PATH, split into words (no shell); @TYPE limits a
#                                     line to a machine type. The base ships none.
#
# Any line, `step` lines included, may start with @TYPE to apply on one machine type only
# (`@Laptop step Power on`).

repository-scope All

[Packages]
trust cask nikitabobko/tap/aerospace

[Spotlight]
index / on

[Firewall]
globalstate on
allowsigned on
allowsignedapp on

[SoftwareUpdate]
defaults /Library/Preferences/com.apple.SoftwareUpdate AutomaticCheckEnabled -bool true
defaults /Library/Preferences/com.apple.SoftwareUpdate AutomaticDownload -bool true
