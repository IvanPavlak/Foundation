# Zone sets - the FancyZones layouts of WinuX (Windows/FancyZones/custom-layouts.json) with the zone
# names of ZoneNameMappings, as AeroSpace columns.
#
#   ZONESET COLUMN ...         columns left to right, each ZONE:PERCENT (full height) or
#                              TOP+BOTTOM:PERCENT (split 50/50 into two rows); PERCENT is the
#                              column's share of the monitor's work area (FancyZones
#                              columns-percentage / 100)
#   alias ZONESET NAME ZONE    a second name for a zone
#
# Every FancyZones layout of the repository is a set of columns, each full height or halved, so
# AeroSpace reproduces them all: columns are tiles side by side, a halved column is a vertical
# container. Windows assigned to the same zone of a single-zone set are stacked (accordion).
#
# Read by Set-WorkspaceWindowLayout (zone sets, aliases, parking-workspace) and Visualize-Layouts
# (zone sets and aliases, the boxes it draws); Test-ConfigurationSchema checks layouts against it.

Zero    Fullscreen:100
One     Left:50 Right:50
Two     Left:33.33 Middle:33.33 Right:33.34
Three   Left:25 Middle-Left:25 Middle-Right:25 Right:25
Four    Top-Left+Bottom-Left:50 Top-Right+Bottom-Right:50
Five    Left:67.25 Right:32.75
Six     Left:50 Top-Right+Bottom-Right:50
Seven   Left:33.33 Middle:33.33 Top-Right+Bottom-Right:33.34
Eight   Left:33.33 Top-Middle+Bottom-Middle:33.33 Top-Right+Bottom-Right:33.34
Nine    Top-Left+Bottom-Left:33.33 Top-Middle+Bottom-Middle:33.33 Top-Right+Bottom-Right:33.34

alias Zero  Full       Fullscreen
alias Three Far-Left   Left
alias Three Far-Right  Right

# Workspace that receives windows found on a desktop but not part of its layout (a tiling
# manager would otherwise share the columns with them); alt-p shows it. "" disables parking.
parking-workspace P
