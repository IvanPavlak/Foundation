# Git identity - the GitConfig.UserName / GitConfig.UserEmail of Configuration.psd1. The base
# ships none; Initialize-Configuration (the first Bootstrap step) writes this Mac's into
# git.local.conf, and the GitIdentity step sets an unset global identity from it (falling back to
# Git/.gitconfig). The global write lands in Git/.gitconfig through the ~/.gitconfig link, as on
# Windows.
#
#   name NAME      git user.name (the rest of the line, spaces kept)
#   email ADDRESS  git user.email
#
# GitStatus (gs) - the GitStatusArguments of Configuration.psd1:
#   status-arguments ARG...   what `gs` passes to git status when called without arguments
#                             (default --short; a bare `status-arguments` runs a plain git status;
#                             arguments given on the call replace these)
#
# A line may start with @TYPE to apply on one machine type only. The base ships no line: git.conf
# is a personal file, and without a status-arguments line GitStatus runs --short.
