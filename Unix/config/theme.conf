# System theme - Themes and SystemTheme.Steps of Configuration(.local).psd1. Read by
# Set-SystemTheme; prompt-theme by the shell rc (foundation-shell-settings).
#
#   theme MACHINE Dark|Light   theme --auto applies on machine type MACHINE (config/machines.conf);
#                              a machine type without a line keeps its theme, as on Windows
#   step NAME on|off           follow-up steps: SetWallpaper (Set-Wallpaper for the new theme,
#                              default on). RestartExplorer and SetLockScreenWallpaper have no
#                              macOS step: the appearance applies live, and the lock screen shows
#                              the desktop picture.
#   prompt-theme PATH          the Oh My Posh theme of the shell prompt; {MachineType} is replaced
#                              by this machine type, ~ and $VARIABLES expand (default:
#                              $DOTFILES_ROOT/Oh-My-Posh/WinuX_Test.omp.json)
#   list-color KEY COLOR       a colour of eza's listing (the ls, ll, la and l aliases), as
#                              Terminal-Icons themes the Windows listing. KEY: directory, file,
#                              executable, symlink, symlink-path, user, user-other, group,
#                              group-other, date, size, size-unit, header, punctuation, or any
#                              two-letter key of `man eza_colors`. COLOR: black red green yellow
#                              blue magenta cyan white default, 0-255, or #RRGGBB. A later line wins
#                              per key; a key without a line keeps eza's colour (the base sets none)

step SetWallpaper on
