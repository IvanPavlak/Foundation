# Workspace templates - the WorkspaceTemplates of Configuration.psd1, read by Open-Workspace (w)
# for the workspaces.conf sections that say `template NAME`.
#
# One [section] per template:
#   var NAME [DEFAULT...]   a variable; without a default every workspace using it must set it.
#                           Defaults may use {Workspace} (the workspace's own name) and other
#                           variables. Workspace, SelectedProjects and ProjectName are reserved.
#   [:ID] ACTION...         an action line exactly as in workspaces.conf (@TYPE and +A,B prefixes
#                           included: @TYPE first, then :ID, then +A,B); :ID names it for the
#                           replace, drop and add lines of a workspace when the template has the
#                           same action twice.
# A template cannot use another template. A workspace-templates.local.conf section replaces the
# same-named template whole.
#
# Example (a fork's templates go in workspace-templates.local.conf):
#   [Project]
#   var Repository {Workspace}Repository
#   Open-Project {Workspace}
#   Open-Browser {Repository} AI YouTube
#   Set-WorkspaceWindowLayout {Workspace}
#   Focus-VirtualDesktop 1
