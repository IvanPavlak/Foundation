# Browser groups - the BrowserGroups list of Configuration.psd1, read by Open-Browser.
# Converted 2026-09-25 from Configuration(.local).psd1; hand-maintained from here on.
#
# A [section] is a group; dotted names nest. A group opens its own URLs plus every nested
# group's, in file order, as the tabs of ONE new browser window. A line is `URL` or `Name URL`;
# a named line is addressable on its own (`Open-Browser DotfilesRepository`).
#
# Lookup order: exact dotted path (GitHub.Personal), then the last segment of any section
# (Personal), then a named URL (DotfilesRepository). Names compare case-insensitively.
#
# The first URL decides the window title (Firefox titles a window after its active tab), which
# is what layout entries match on - keep a layout's title pattern in step with the first URL.

