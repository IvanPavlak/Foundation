# Kill-All - KillAll.Steps, Universal.VisibleWindowExclusions and Universal.TerminateProcessNames.
#
#   step NAME on|off      default state of a step; -Skip / -Include override per call. A step
#                         whose line an overlay takes back (-LINE) keeps this file's state
#   keep TOKEN            never quit this app in the VisibleWindows step (tokens from apps.conf,
#                         or an app name as AeroSpace reports it). The Terminal role and Finder
#                         are never quit without a line too; no keep line at all makes the step
#                         warn and quit nothing, as on Windows
#   quit TOKEN            always quit this in the NamedProcesses step: an apps.conf token, else a
#                         bundle id, else - when no app answers to it - a process by its exact
#                         name (a daemon or helper such as VBoxSVC), ended with pkill, then
#                         pkill -9 after 5 s. No quit line at all is a warning, as on Windows
#
# Steps run in this order: VirtualDesktops Docker Browsers VisibleWindows NamedProcesses
# TerminalTabs MoveTerminal CenterTerminal FocusTerminal ReloadProfile.

step VirtualDesktops  on
step Docker           on
step Browsers         on
step VisibleWindows   on
step NamedProcesses   on
step TerminalTabs     on
# Off by default: move the surviving terminal window to desktop 1 (skipped with --include-current).
step MoveTerminal     off
# Off on Unix: the terminal stays tiled and fills its desktop instead of floating centered
# (Center-Terminal). `Kill-All --include CenterTerminal` centers it for one run.
step CenterTerminal   off
step FocusTerminal    on
step ReloadProfile    off

keep Terminal
keep Finder
keep AeroSpace

quit Code
