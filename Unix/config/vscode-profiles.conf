# VS Code profiles - VSCodeProfiles of Configuration(.local).psd1. Read by Deploy-VSCodeProfiles
# (Bootstrap's opt-in VSCodeProfiles step) and Export-VSCodeProfile.
#
#   root PATH              the profile folders, one per `profile` entry (default
#                          $DOTFILES_ROOT/VSCode/Profiles): settings.json, keybindings.json
#                          (keybindings.macos.json wins on the Mac), tasks.json, snippets/,
#                          extensions.txt
#   extensions PATH        the local extensions (default $DOTFILES_ROOT/VSCode/Extensions): one
#                          unpackaged extension folder with a package.json each, such as a colour
#                          theme of your own, linked into ~/.vscode/extensions as
#                          <publisher>.<name>-<version>; never installed from the Marketplace and
#                          never pruned. Nothing is linked while the folder is missing
#   user-data PATH         VS Code's user data folder, the Default profile (default
#                          ~/Library/Application Support/Code/User)
#   settings-sync on|off   off (default): extensions install with --do-not-sync, so Settings
#                          Sync leaves them alone; on: they install normally and Sync carries them
#   prune on|off           on: uninstall extensions extensions.txt does not name (default off;
#                          Deploy-VSCodeProfiles --prune does it for one run)
#   profile NAME [TARGET]  a catalogue entry: the folder NAME, deployed onto the VS Code profile
#                          TARGET (default NAME; Default is VS Code's built-in profile)
#   deploy NAME...         the entries this machine deploys; the last line for this machine type
#                          wins, so write the untagged line first and @TYPE lines after it
#
# Every line may start with @TYPE (machines.conf). The base catalogue is empty, so a run deploys
# nothing until a fork adds its profiles (in vscode-profiles.local.conf).
