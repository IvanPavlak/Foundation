# File logging of the Unix half - the Logging section of Configuration.psd1. Every Foundation command
# mirrors its log lines into Unix/logs/Session_<timestamp>_<Command>.log (gitignored), errors
# also into Unix/logs/Errors.log. Retention runs on every new session; 0 disables a limit, and
# Unix/logs/Pinned is never pruned. An Errors.log past max-error-file-size-mb is trimmed to its
# newest half of that size. FOUNDATION_LOGGING=off turns logging off for one run. Read as every
# config file is: the logging.local.conf overlay, @TYPE lines and -LINE removals apply.
#
#   level        the console level a command starts with (DefaultLevel): normal, quiet (only
#                warnings and errors) or verbose (debug lines too). FOUNDATION_LOG_LEVEL beats it
#                (exported for a shell, prefixed for one command), -v beats both for one command.
#   directory    the log folder (FileLogging.Directory): empty = Unix/logs, ~ = the home folder,
#                a relative path is under the repository. FOUNDATION_LOG_DIR beats it for one run.
#   error-file   the error log's name in that folder (FileLogging.ErrorFileName).
#   color        `color STYLE COLOR` (Colors) for STYLE title, step, success, warning, error, debug
#                or info: a List-AvailableColors name (Cyan, BrightBlack, ...), plain, or an SGR
#                code (38;5;208). Unset styles keep cyan, plain, green, yellow, red, grey, blue.
#   maintenance  the periodic sweep, Invoke-LogMaintenance (Maintenance.Enabled): backups pruned by
#                backups.conf and Unix/tests/Results by the Run-Tests rules, run from a new
#                session's background retention at most every maintenance-interval-hours
#                (IntervalHours; stamp Unix/logs/.last-maintenance).

logging                     on
level                       normal
directory
error-file                  Errors.log
max-age-days                7
max-session-files           20
max-total-size-mb           50
max-error-file-size-mb      5
maintenance                 on
maintenance-interval-hours  24
