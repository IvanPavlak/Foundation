# AI profiles - the one AI profile each machine runs: its rules, the Plan Claude Code must be signed
# in to, which harnesses, artifacts, MCP servers and marketplaces it gets, and which repositories it
# owns. Read by Deploy-AiArtifacts, Deploy-AiMcpServers, Deploy-AiMarketplaces, List-AiArtifacts,
# Update-AiArtifacts, Test-AiProfile and Initialize-AiProfile. Design: docs/foundation/ai.md.
#
# No [Profile] section (the base ships none): profiles are off, and every AI command behaves as
# without this file (the deploy, use and exclude lines of ai-artifacts.conf, every MCP server and
# marketplace). The profile is picked once per command: FOUNDATION_AI_PROFILE, then the last
# `host` line naming this Mac, then the last `default` line.
#
# Before the first section (every line may start with @TYPE, machines.conf):
#   host NAME PROFILE         the profile of the Mac whose local hostname is NAME
#                             (scutil --get LocalHostName, compared without case)
#   default PROFILE           the profile of every other Mac
#   shared PATTERN...         repositories every profile may work on
#   default-owner PROFILE     the profile that owns a repository no `owns` or `shared` pattern
#                             matches
#
# One [Profile] section per profile:
#   rules NAME                the rules item its file destinations take (wins over `use rules`)
#   plan NAME UUID...         its Plan: a display name and the organization UUID(s) Claude Code
#                             must be signed in to; the managed settings copy pins them
#                             (forceLoginOrgUUID)
#   deploy HARNESS...         the harnesses it deploys into (wins over `deploy` of ai-artifacts.conf)
#   include KIND/NAME...      a kind named here deploys only these items (KIND/SOURCE/NAME for the
#                             one of one source); a kind not named deploys all of its items
#   exclude KIND/NAME...      items it never gets, added to the excludes of ai-artifacts.conf
#   mcp NAME...               the MCP servers of ai-mcp-servers.conf it registers (no mcp line:
#                             all of them; a bare `mcp` line: none); a server Deploy-AiMcpServers
#                             registered earlier that this list drops is removed
#   marketplaces NAME...      the marketplaces of ai-marketplaces.conf it installs (no line: all;
#                             a bare line: none)
#   unattended on|off         whether unattended runs are allowed on its machines (default off)
#   owns PATTERN...           the repositories it owns (the ownership guard refuses them to every
#                             other profile)
#   autonomous PATTERN...     its repositories where its rules allow merging
#   env NAME...               environment variables it needs (Initialize-AiProfile checks they are
#                             set; their values never go into a file of the repository)
# A PATTERN is a shell glob on the `origin` remote normalised to host/owner/name: lowercase, no
# scheme, no user, no .git (github.com/my-org/*).
#
# Example:
#   host My-Work-Mac Work
#   default Personal
#   default-owner Personal
#   shared github.com/myuser/dotfiles
#
#   [Personal]
#   rules         Personal
#   plan          Max 00000000-0000-0000-0000-000000000000
#   unattended    on
#   autonomous    github.com/myuser/myproject
#
#   [Work]
#   rules         Work
#   plan          Team 11111111-1111-1111-1111-111111111111
#   mcp
#   exclude       skills/my-personal-skill
#   owns          github.com/my-org/*
