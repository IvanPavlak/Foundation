# AI artifacts - the skills, mods, rules, prompts and agents Deploy-AiArtifacts links into the AI
# apps of ai-harnesses.conf. Read by Deploy-AiArtifacts, Update-AiArtifacts and List-AiArtifacts.
# Design: docs/unix/ai.md.
#
# The artifacts live under the root, kind first: <root>/<Kind>/<source>/<item>, Kind one of Skills,
# Mods, Rules, Prompts, Agents. A source folder is `own` (your own items, read first, so it wins a
# name clash, with a warning), `foundation` (the skills Foundation ships), `example` (the example
# rules) or a [section] below (vendored by Update-AiArtifacts); any other folder is not read.
#
# Before the first section (every line may start with @TYPE, machines.conf; paths take ~ and
# $VARIABLES, $DOTFILES_ROOT is the repository):
#   root PATH                 the artifacts root (default $DOTFILES_ROOT/AI; the last line wins)
#   deploy HARNESS...         the [sections] of ai-harnesses.conf this machine deploys into; the
#                             last line for this machine type wins, so write the untagged line
#                             first and @TYPE lines after it (none: nothing is deployed)
#   exclude KIND/NAME...      items not to deploy (skills/tdd), or KIND/SOURCE/NAME for the one of
#                             one source (rules/example/CoreAiRules)
#   use KIND NAME             the item a `file` destination of KIND takes (the rules linked as
#                             ~/.claude/CLAUDE.md, ~/.codex/AGENTS.md, ...); without one such a
#                             destination links nothing; the last line for a kind wins
#
# One [section] per vendored source; Update-AiArtifacts copies it into <root>/<Kind>/<section>/:
#   repository OWNER/NAME     the GitHub repository
#   ref REF                   branch, tag or commit to pin (default main)
#   skills|mods|rules|prompts|agents PATH...
#                             the upstream folders holding items of that kind, `.` for the root
#                             (no kind line: `skills skills`)
#   exclude ITEM...           items not to vendor
#   skip NAME...              top-level entries of an item not to copy (default .git .github tests
#                             design docs)
#
# Example:
#   [mattpocock]
#   repository  OWNER/skills
#   skills      skills/engineering

# The example rules; a fork names its own rules item here (own wins a name clash with it).
use rules CoreAiRules
