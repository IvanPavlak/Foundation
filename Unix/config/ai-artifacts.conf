# AI artifacts - the skills, mods, rules, prompts and agents Deploy-AiArtifacts links into the AI
# apps of ai-harnesses.conf. Read by Deploy-AiArtifacts, Update-AiArtifacts and List-AiArtifacts.
# Design: docs/foundation/ai.md.
#
# The artifacts live under the root, kind first: <root>/<Kind>/<source>/<item>, Kind one of Skills,
# Mods, Rules, Prompts, Agents. A source folder is `own` (your own items, read first, so it wins a
# name clash, with a warning), `foundation` (the skills Foundation ships), `example` (the example
# rules) or a vendored [section] below (copied by Update-AiArtifacts); any other folder is not read.
# A [section] can instead be a checkout source (a local repository linked in place) or a manifest
# source (rows linked from pinned clones in ~/.local/share/foundation/ai-manifests/). Precedence,
# the first winning a name clash with a warning: own, checkout sources, foundation, example,
# vendored sources, manifest rows. An AI profile (ai-profiles.conf) can replace the deploy and use
# rules lines and add include and exclude lines.
#
# Before the first section (every line may start with @TYPE, machines.conf; paths take ~ and
# $VARIABLES, $DOTFILES_ROOT is the repository):
#   root PATH                 the artifacts root (default $DOTFILES_ROOT/AI; the last line wins)
#   deploy HARNESS...         the [sections] of ai-harnesses.conf this machine deploys into; the
#                             last line for this machine type wins, so write the untagged line
#                             first and @TYPE lines after it (none: nothing is deployed)
#   exclude KIND/NAME...      items not to deploy (skills/tdd), or KIND/SOURCE/NAME for the one of
#                             one source (rules/example/CoreAiRules)
#   use KIND NAME             the item a `file` destination of KIND takes (the rules linked as
#                             ~/.claude/CLAUDE.md, ~/.codex/AGENTS.md, ...); without one such a
#                             destination links nothing; the last line for a kind wins
#
# One [section] per source. A vendored source; Update-AiArtifacts copies it into
# <root>/<Kind>/<section>/:
#   repository OWNER/NAME     the GitHub repository
#   ref REF                   branch, tag or commit to pin (default main)
#   skills|mods|rules|prompts|agents PATH...
#                             the upstream folders holding items of that kind, `.` for the root
#                             (no kind line: `skills skills`)
#   exclude ITEM...           items not to vendor
#   skip NAME...              top-level entries of an item not to copy (default .git .github tests
#                             design docs)
#
# A checkout source (its items linked from the repository's working tree, never copied):
#   checkout PATH             the local repository ($DEV/MyRepo)
#   skills|mods|rules|prompts|agents FOLDER...
#                             its folders holding items of that kind (no kind line: `skills skills`;
#                             a skills folder without SKILL.md is looked into once, a category)
# A manifest source (the same section can be both):
#   manifest FILE             a tab-separated manifest: one header row, then one row per item with
#                             name, kind, scope (*, PROFILE,PROFILE or repo:NAME), source
#                             (https://github.com/OWNER/REPO), ref (a full commit SHA), path and
#                             install (clone [rename=NAME] [strip-invocation-guard]); format:
#                             docs/foundation/ai.md#manifest-sources. Update-AiArtifacts clones each
#                             ref once (a rename= or strip-invocation-guard row is linked from a
#                             derived copy with its SKILL.md name: or guard changed); a row's
#                             source name is its upstream owner
#                             (exclude skills/OWNER/NAME); a repo:NAME row is linked into that
#                             repository's .claude/skills/ (repositories.conf)
#
# Example:
#   [mattpocock]
#   repository  OWNER/skills
#   skills      skills/engineering
#
#   [myskills]
#   checkout    $DEV/MySkills
#   skills      skills
#   manifest    $DEV/MySkills/third-party/manifest.tsv

# The example rules; a fork names its own rules item here (own wins a name clash with it).
use rules CoreAiRules
