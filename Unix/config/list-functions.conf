# List-Functions output - ListFunctionsColors, ShowFunctionDetailsColors and
# FunctionDiscrepancyExclusions of Configuration.psd1.
#
#   border COLOR                 the module and total borders (Border)
#   discrepancy-error COLOR      the discrepancy report (DiscrepancyError)
#   discrepancy-success COLOR    the "no discrepancies" line (DiscrepancySuccess)
#   function-name COLOR          each command's name (FunctionName)
#   description COLOR            its description (Description)
#   parameters COLOR...          the colours the `Key => value` lines cycle through (Parameters)
#   exclude NAME                 a name the discrepancy check ignores in every direction, one per
#                                line (an executable that is neither a command nor a helper)
#
# A COLOR is a name of List-AvailableColors (Black, Red, Green, Yellow, Blue, Magenta, Cyan, White,
# each also as Bright<Name>) or a 256-colour number. The defaults are the Windows colours: DarkCyan
# is Cyan here, Gray is White, Cyan is BrightCyan. Lines take @TYPE like any other.

border               Cyan
discrepancy-error    BrightRed
discrepancy-success  BrightGreen
function-name        Cyan
description          White
parameters           BrightCyan Cyan BrightBlue Blue
