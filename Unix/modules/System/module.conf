# System module manifest - the .psd1 analog. `description` is shown by List-Functions;
# `command` lines are the documented exports (docs/unix/modules/System.md), `function` lines the shell
# functions of functions.sh, `helper` lines the undocumented POSIX scripts of bin.
description Machine-wide actions: closing everything, terminal tabs, Wake-on-LAN and reachability, upgrades, drives, theme and wallpaper, languages and keyboard layouts, dated folders, special folders, installed apps, .NET SDKs, machine name, restart, the terminal greeting and the shell profile and its start-up time.
