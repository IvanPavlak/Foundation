# Logging module manifest - the .psd1 analog. `description` is shown by List-Functions;
# `command` lines are the documented exports (docs/foundation/modules/Logging.md), `function` lines the shell
# functions of functions.sh, `helper` lines the undocumented POSIX scripts of bin.
description Finds, pins and prunes the session and error logs every Foundation command writes.
command Clear-OldLogs
command Get-LogPath
command Invoke-LogMaintenance
command Protect-Log
