# Window module manifest - the .psd1 analog. `description` is shown by List-Functions;
# `command` lines are the documented exports (docs/foundation/modules/Window.md), `function` lines the shell
# functions of functions.sh, `helper` lines the undocumented POSIX scripts of bin.
description Desktops (AeroSpace workspaces), window lookup and inspection, moving, centering and resizing windows, workspace layouts and their drawings.
command Center-Terminal
command Center-Windows
command Focus-VirtualDesktop
command Get-ActiveWindowInfo
command Get-WindowHandle
command Move-Windows
command Reset-Windows
command Resize-Windows
command Set-WorkspaceWindowLayout
command Visualize-Layouts
