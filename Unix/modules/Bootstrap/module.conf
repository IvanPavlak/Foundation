# Bootstrap module manifest - the .psd1 analog. `description` is shown by List-Functions;
# `command` lines are the documented exports (docs/unix/modules/Bootstrap.md), `function` lines the shell
# functions of functions.sh, `helper` lines the undocumented POSIX scripts of bin.
description Provisions a Mac: the Bootstrap runner and its steps - the first-run identity and paths, dotfiles, the Firefox profile, system defaults, power settings, Dock pins, login items, dotnet-ef, extra .NET SDK channels, Conda environments and the NuGet config.
command Bootstrap
command Configure-NuGetConfig
command Deploy-FirefoxProfile
command Initialize-Configuration
command Install-CondaEnvironments
command Install-DotnetEf
command Install-DotnetSdks
command Set-DockPins
command Set-LoginItems
command Set-PowerSettings
command Set-SystemDefaults
helper bootstrap-first-run
