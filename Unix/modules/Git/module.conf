# Git module manifest - the .psd1 analog. `description` is shown by List-Functions;
# `command` lines are the documented exports (docs/unix/modules/Git.md), `function` lines the shell
# functions of functions.sh, `helper` lines the undocumented POSIX scripts of bin.
description Git shorthands and repository cloning and updating.
command Git-Diff
command GitBranch
command GitBranchDeleteAndPrune
command GitMergeM
command GitPull
command GitStatus
command GitSwitch
command Initialize-Repository
command Invoke-StartupRepositoryUpdate
command Merge-Upstream
command Test-GitRepository
command Update-Repositories
helper git-obsidian
