# AI module manifest - the .psd1 analog. `description` is shown by List-Functions;
# `command` lines are the documented exports (docs/unix/modules/AI.md), `function` lines the shell
# functions of functions.sh, `helper` lines the undocumented scripts of bin (each with its own suite).
description Deploys the AI skills, mods, rules, prompts and agents into the AI apps of the machine, installs the Claude Code plugin marketplaces, adds the MCP servers to Claude Code and Codex, lists the artifacts the repository carries and vendors them from upstream.
command Deploy-AiArtifacts
command Deploy-AiMarketplaces
command Deploy-AiMcpServers
command List-AiArtifacts
command Update-AiArtifacts
