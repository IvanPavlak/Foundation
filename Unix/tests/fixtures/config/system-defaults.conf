# Fixture for Set-SystemDefaults.bats - generic values, one of every line kind.

[Dock]
defaults com.apple.dock autohide -bool true
defaults com.apple.dock tilesize -int 40
@Laptop defaults com.apple.dock tilesize -int 32
restart Dock

[Finder]
defaults com.apple.finder FXPreferredViewStyle -string Nlsv
defaults com.apple.menuextra.clock DateFormat -string EEE d MMM HH:mm
restart Finder Dock

[Screenshots]
mkdir ~/Pictures/Shots
defaults com.apple.screencapture location -string ~/Pictures/Shots
restart SystemUIServer

[Trackpad]
currenthost NSGlobalDomain com.apple.mouse.tapBehavior -int 1
delete com.apple.dock persistent-others
defaults com.apple.dock persistent-apps -array one two
note Log out for the trackpad.

[Theme]
command Set-SystemTheme Dark --skip SetWallpaper
